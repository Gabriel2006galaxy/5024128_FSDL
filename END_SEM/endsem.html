<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palindrome Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
      background: #f6f9fc;
      color: #1f2937;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .card {
      max-width: 560px;
      padding: 24px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    label,
    input,
    button,
    p {
      display: block;
      width: 100%;
    }

    input {
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin: 10px 0 18px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      min-height: 1.5rem;
      margin-top: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Palindrome Checker</h1>
    <label for="textInput">Enter text:</label>
    <input id="textInput" type="text" placeholder="Type a phrase or sentence" />
    <button id="checkButton">Check Palindrome</button>
    <p id="result"></p>
  </section>

  <script>
    const input = document.getElementById('textInput');
    const button = document.getElementById('checkButton');
    const result = document.getElementById('result');

    function checkPalindrome() {
      const text = input.value.trim();

      if (text.length === 0) {
        result.textContent = 'Error: input cannot be empty. Please enter a string.';
        result.style.color = '#dc2626';
        return;
      }

      const normalized = text.replace(/\s+/g, '').toLowerCase();
      const reversed = normalized.split('').reverse().join('');
      const isPalindrome = normalized === reversed;

      if (isPalindrome) {
        result.textContent = `"${text}" is a palindrome!`;
        result.style.color = '#16a34a';
      } else {
        result.textContent = `"${text}" is not a palindrome.`;
        result.style.color = '#1d4ed8';
      }
    }

    button.addEventListener('click', checkPalindrome);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkPalindrome();
      }
    });
  </script>
</body>
</html>
