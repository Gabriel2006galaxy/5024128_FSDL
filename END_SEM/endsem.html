<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Palindrome Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #333;
    }

    label,
    input,
    button,
    p {
      display: block;
      width: 100%;
    }

    input {
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #999;
      border-radius: 4px;
    }

    button {
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #555;
      border-radius: 4px;
      background: #eee;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }

    #result {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Palindrome Checker</h1>
  <label for="textInput">Enter a phrase:</label>
  <input id="textInput" type="text" placeholder="e.g. Race car" />
  <button id="checkButton">Check</button>
  <p id="result"></p>

  <script>
    const input = document.getElementById('textInput');
    const button = document.getElementById('checkButton');
    const result = document.getElementById('result');

    function isPalindrome(text) {
      const normalized = text.replace(/\s+/g, '').toLowerCase();
      const reversed = normalized.split('').reverse().join('');
      return normalized === reversed;
    }

    function showResult() {
      const value = input.value.trim();

      if (value === '') {
        result.textContent = 'Please type something first.';
        result.style.color = 'red';
        return;
      }

      if (isPalindrome(value)) {
        result.textContent = `"${value}" is a palindrome.`;
        result.style.color = 'green';
      } else {
        result.textContent = `"${value}" is not a palindrome.`;
        result.style.color = 'blue';
      }
    }

    button.addEventListener('click', showResult);
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        showResult();
      }
    });
  </script>
</body>
</html>
